<div class="flex flex-col items-center justify-center h-screen bg-gray-100 dark:bg-gray-900">
  <div class="w-[60vh] bg-white dark:bg-gray-800 border border-cyan-700 dark:border-cyan-500 rounded-xl p-6">
    <h2 class="text-2xl font-bold text-gray-800 dark:text-gray-100 mb-4 text-center">Add New Note</h2>

    <input
      type="text"
      placeholder="Title"
      [(ngModel)]="newTodo.title"
      class="w-full p-3 mb-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-700 dark:bg-gray-700 dark:text-gray-100"
    />

    <textarea
      rows="5"
      placeholder="Description"
      [(ngModel)]="newTodo.description"
      class="w-full p-3 mb-4 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-700 dark:bg-gray-700 dark:text-gray-100"
    ></textarea>

    <button
      (click)="saveTodo()"
      class="w-full bg-cyan-700 hover:bg-cyan-800 text-white text-xl font-semibold py-2 px-4 rounded-lg duration-200"
    >
      Save
    </button>
  </div>
</div>
