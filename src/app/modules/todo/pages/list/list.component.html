<div class="bg-gray-100 p-6">
  <div *ngFor="let notes of todos" (click)="selectedId = notes.id"
     [ngClass]="{
       'bg-cyan-100 shadow-md shadow-cyan-200 border-cyan-700': notes.id === selectedId,
       'bg-white border-cyan-600': notes.id !== selectedId}"
       class="flex flex-col justify-between m-4 rounded-xl border p-5 cursor-pointer transition duration-300">

    <div class="flex justify-between items-center mb-4">
      <h1 class="text-2xl font-semibold text-cyan-900">{{ notes.title }}</h1>
      <div class="text-xs bg-blue-100 text-cyan-900 h-8 min-w-16 px-4 py-2 rounded-lg border border-blue-300">
        {{ notes.date }}</div>
    </div>

    <!-- description-->
    <p class="text-gray-700 text-sm mb-4">{{ notes.description }}</p>

    <!-- buttons -->
    <div class="flex justify-end space-x-3 ">
      <button 
        class="w-24 py-2 text-sm font-medium bg-white text-blue-600 border border-blue-300 rounded-lg hover:bg-blue-600 hover:text-white duration-300">
       Edit </button>  
      <button 
        class="w-24 py-2 text-sm font-medium bg-white text-red-500 border border-red-300 rounded-lg hover:bg-red-500 hover:text-white duration-300" 
        (click)="deleteNote(notes.id)">
       Delete </button>
    </div>
  </div>
</div>
